services:
  api:
    build:
      context: .
      target: development
    container_name: EC-Backend-App
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - ELASTICSEARCH_URL=http://ec-elastic-search:9200
    volumes:
      - ./src:/app/src
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - elk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: EC-Elastic-Search
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      elk:
        aliases:
          - ec-elastic-search
          - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch-setup:
    build:
      context: .
      target: development
    container_name: EC-Elasticsearch-Setup
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_URL=http://ec-elastic-search:9200
    volumes:
      - ./src:/app/src
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["node", "src/scripts/setup-elasticsearch.js"]
    networks:
      - elk
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: EC-Kibana-Dashboard
    environment:
      - ELASTICSEARCH_HOSTS=http://ec-elastic-search:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana-setup:
    build:
      context: .
      target: development
    container_name: EC-Kibana-Setup
    env_file:
      - .env
    environment:
      - KIBANA_URL=http://kibana:5601
    volumes:
      - ./src:/app/src
    depends_on:
      kibana:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    command: ["node", "src/scripts/setup-kibana.js"]
    networks:
      - elk
    restart: "no"

volumes:
  elasticsearch_data:

networks:
  elk:
    driver: bridge